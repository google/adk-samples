type: "standalone"      # Options: [standalone | module]
status: "active"        # Options: [active | inactive]
language: "python"      # Options: [python | java | go | kotlin | typescript]
description: "This project provides an intelligent, two-stage agentic system built
  with the Google Cloud Agent Development Kit (ADK) to automate the migration of Apache
  Airflow DAGs from a source version to a target version. The system leverages Gemini
  models, Vertex AI Search for Retrieval-Augmented Generation (RAG), and a custom-built
  knowledge base in BigQuery to provide accurate, context-aware code conversions."                          # TODO: review and expand this draft description

architecture:
  agent: "multi"        # Options: [single | multi]
  stateful: true        # Options: [true | false]
  datasources:          # Options: [hardcoded | local | external]
  - "external"

