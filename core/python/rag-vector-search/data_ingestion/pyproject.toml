[project]
name = "data-ingestion-pipeline"
version = "0.1.0"
description = "Data ingestion pipeline for RAG retriever"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
    "backoff>=2.2.0",
    "bigframes>=2.46.0",
    "docker>=7.2.0",
    "google-cloud-aiplatform>=1.163.0",
    "google-cloud-bigquery>=3.42.2",
    "google-cloud-pipeline-components>=2.22.0",
    "google-cloud-vectorsearch>=0.11.1",
    "kfp>=2.17.0",
    "langchain-text-splitters>=1.1.2",
    "markdownify>=1.2.3",
    "pandas<4",
    "swifter>=1.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Use public PyPI as the default index for this subproject.
[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true

[tool.hatch.build.targets.wheel]
packages = ["data_ingestion_pipeline"]