name: Validate Recipe Structure

# Language-agnostic structural validation for every recipe under `core/`,
# `contrib/`, and `skills/`: manifest presence + schema, folder name,
# size, file count, and required files (matrix from `.github/policy.yml`).

on:
  pull_request:
    # `labeled` is included so that applying the `allow-legacy-path` escape
    # hatch re-runs the retired-folder check instead of needing a manual
    # re-run. The other three are the GitHub defaults, which listing
    # `types` at all would otherwise drop.
    types: [opened, synchronize, reopened, labeled]
    paths:
      - 'core/**'
      - 'contrib/**'
      - 'skills/**'
      # Retired recipe roots (policy.yml `frozen_paths`). Without these the
      # workflow never fires for a PR that only touches a retired folder,
      # and the check below could never see it.
      - 'python/agents/**'
      - 'java/agents/**'
      - 'go/agents/**'
      - 'kotlin/agents/**'
      - 'typescript/agents/**'
      - '.github/schemas/manifest-schema.json'
      - '.github/policy.yml'
      - '.github/workflows/validate-recipe-structure.yml'
      - '.github/scripts/generate_dependabot.py'
      - 'tools/validate.py'
      - 'tools/validate_manifest.py'
      - 'tools/validate_structure.py'
      - 'tools/validate_readme.py'
      - 'tools/affected_recipes.py'
      - 'tools/check_frozen_paths.py'
      - 'tools/validate_placement.py'
      - 'pyproject.toml'
  push:
    branches:
      - main
    paths:
      - 'core/**'
      - 'contrib/**'
      - 'skills/**'
      - '.github/schemas/manifest-schema.json'
      - '.github/policy.yml'
      - '.github/workflows/validate-recipe-structure.yml'
      - '.github/scripts/generate_dependabot.py'
      - 'tools/validate.py'
      - 'tools/validate_manifest.py'
      - 'tools/validate_structure.py'
      - 'tools/validate_readme.py'
      - 'tools/affected_recipes.py'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-structure:
    name: Check recipe structure and content
    runs-on: ubuntu-latest
    # Structure checks are pure Python (no builds); 15 minutes leaves plenty
    # of headroom even on the full-repo scan path.
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # ratchet:actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@445689ea25e0de0a23313031f5fe577c74ae45a1 # ratchet:astral-sh/setup-uv@v6.3.0
        with:
          # Pin explicitly for reproducibility and to match the sibling
          # python-validate-recipe.yml step. Structure checks only need
          # stdlib + PyYAML + jsonschema, so any 3.11+ interpreter works;
          # 3.11 is the repo-wide minimum (see [project].requires-python
          # in the root pyproject.toml).
          python-version: "3.11"
          enable-cache: false

      - name: Install validation dependencies
        # tools/validate_structure.py and its helpers depend on PyYAML and
        # jsonschema, both declared in the repo-root pyproject.toml.
        run: uv sync

      - name: Detect affected recipe directories
        id: affected
        env:
          # Route every GitHub-controlled value through env vars rather
          # than direct expression interpolation, same as the sibling
          # workflows — mitigates expression injection.
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          # workflow_dispatch, or a first push to a new branch (BEFORE is
          # all-zeros), has no base to diff against — validate everything.
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git fetch origin "$BASE_REF"
            CHANGED_FILES=$(git diff --name-only "origin/$BASE_REF"...HEAD)
          elif [ "$EVENT_NAME" = "push" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            CHANGED_FILES=$(git diff --name-only "$BEFORE" HEAD)
          else
            echo "No base to diff against — will validate all recipes."
            echo "validate_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "Changed files:"
          echo "$CHANGED_FILES"

          # If any infra file that controls this workflow's behaviour
          # changed, validate ALL recipes so the new config applies across
          # the board.
          INFRA_CHANGED=$(echo "$CHANGED_FILES" | grep -E "^(\.github/(schemas/manifest-schema\.json|policy\.yml|workflows/validate-recipe-structure\.yml)|tools/(validate|validate_manifest|validate_structure|validate_readme|affected_recipes)\.py|pyproject\.toml)$" || true)
          if [ -n "$INFRA_CHANGED" ]; then
            echo "Schema, policy, workflow, or tool changed — will validate all recipes."
            echo "validate_all=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Map changed files → affected recipe directories via the shared
          # helper (also unit-tested in tools/tests/test_affected_recipes.py).
          # Runs against the project venv (created by `uv sync` above) —
          # NOT `--no-project`: affected_recipes.py imports PyYAML and the
          # `validate_manifest` package, both provided by that venv.
          CHANGED_RECIPES=$(echo "$CHANGED_FILES" | uv run python tools/affected_recipes.py)

          echo "Affected recipes:"
          echo "$CHANGED_RECIPES"

          {
            echo "changed_recipes<<RECIPES_EOF"
            echo "$CHANGED_RECIPES"
            echo "RECIPES_EOF"
          } >> "$GITHUB_OUTPUT"
          echo "validate_all=false" >> "$GITHUB_OUTPUT"

      - name: Validate affected recipes
        env:
          VALIDATE_ALL: ${{ steps.affected.outputs.validate_all }}
          CHANGED_RECIPES: ${{ steps.affected.outputs.changed_recipes }}
        run: |
          set -euo pipefail

          if [ "$VALIDATE_ALL" = "true" ]; then
            # Both validators walk core/, contrib/, and skills/ in one pass.
            FAILED=0
            uv run validate structure || FAILED=1
            uv run validate readme    || FAILED=1
            exit $FAILED
          fi

          if [ -z "$CHANGED_RECIPES" ]; then
            echo "[INFO] No recipe directories to validate."
            exit 0
          fi

          # Per-recipe invocation: keeps annotations scoped to the recipe
          # under review and lets one broken recipe not short-circuit
          # validation of the others in the same PR.
          FAILED=0
          while IFS= read -r recipe; do
            [ -z "$recipe" ] && continue
            uv run validate structure "$recipe" || FAILED=1
            uv run validate readme    "$recipe" || FAILED=1
          done <<< "$CHANGED_RECIPES"

          if [ "$FAILED" -eq 1 ]; then
            echo ""
            echo "========================================"
            echo "  One or more recipes failed structural validation."
            echo "  See errors above for details."
            echo "========================================"
            exit 1
          fi

  check-frozen-paths:
    name: Check for work in retired folders
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Pull requests only — on a push to main the merge has already happened,
    # so failing there is noise rather than a gate.
    #
    # Skipped for bot authors: Dependabot still has open PRs touching the
    # retired roots, and blocking them would just generate churn. Matching on
    # the `[bot]` suffix rather than naming Dependabot covers future bots too.
    #
    # Skipped when a maintainer applies `allow-legacy-path`. Only users with
    # write access can label a PR, so this is the same permission boundary as
    # an admin override — but it is explicit and recorded on the PR.
    if: >-
      github.event_name == 'pull_request' &&
      !endsWith(github.event.pull_request.user.login, '[bot]') &&
      !contains(github.event.pull_request.labels.*.name, 'allow-legacy-path')

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # ratchet:actions/checkout@v4
        with:
          # Full history so the merge-base diff below resolves.
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@445689ea25e0de0a23313031f5fe577c74ae45a1 # ratchet:astral-sh/setup-uv@v6.3.0
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Install validation dependencies
        # tools/check_frozen_paths.py reads .github/policy.yml, so it needs
        # PyYAML from the repo-root pyproject.toml.
        run: uv sync

      - name: Check for changes in retired recipe folders
        env:
          # Route the GitHub-controlled value through an env var rather than
          # interpolating it directly, same as the sibling job above.
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -euo pipefail

          git fetch origin "$BASE_REF"

          # --diff-filter=AM keeps additions and modifications only.
          # Deletions and renames are deliberately excluded so that MOVING a
          # recipe out of a retired folder is never blocked by this check.
          git diff --diff-filter=AM --name-only "origin/$BASE_REF"...HEAD \
            | uv run python tools/check_frozen_paths.py

  check-recipe-placement:
    name: Check recipe placement
    runs-on: ubuntu-latest
    timeout-minutes: 5

    # Deliberately unconditional — unlike check-frozen-paths there is no bot
    # or label exemption. A whole-tree scan, so it also catches a
    # misplacement that arrives by rename or bad merge rather than by an
    # obvious "add a recipe" diff.
    #
    # It cannot ride on the validate-structure job above: that runs the
    # validators per AFFECTED recipe, and affected_recipes.py maps a
    # misplaced skill (skills/<solution> with no vertical) to None, so it
    # would never appear in changed_recipes.

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # ratchet:actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@445689ea25e0de0a23313031f5fe577c74ae45a1 # ratchet:astral-sh/setup-uv@v6.3.0
        with:
          python-version: "3.11"
          enable-cache: false

      - name: Install validation dependencies
        # validate_placement imports validate_manifest, which needs PyYAML
        # from the repo-root pyproject.toml.
        run: uv sync

      - name: Check every recipe sits at its required path
        run: uv run python tools/validate_placement.py

  check-dependabot-config:
    name: Check dependabot.yml is up to date
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # ratchet:actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # ratchet:actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check dependabot.yml is fresh
        run: |
          python .github/scripts/generate_dependabot.py --check
          echo "[PASS] dependabot.yml matches the current recipe tree."
