name: '🧹 Gemini PR Review — Maintainability'

on:
  pull_request:
    types:
      - 'opened'
      - 'reopened'
      - 'synchronize'
  issue_comment:
    types:
      - 'created'
  pull_request_review_comment:
    types:
      - 'created'
  pull_request_review:
    types:
      - 'submitted'
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to review'
        required: true
        type: 'number'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.event.inputs.pr_number || github.ref }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

permissions:
  contents: 'read'
  id-token: 'write'
  issues: 'write'
  pull-requests: 'write'

jobs:
  review-pr-maintainability:
    if: |-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.fork == false &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.pull_request.author_association)
      ) ||
      (
        (
          (
            github.event_name == 'issue_comment' &&
            github.event.issue.pull_request
          ) ||
          github.event_name == 'pull_request_review_comment'
        ) &&
        contains(github.event.comment.body, '@gemini-cli /review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review' &&
        contains(github.event.review.body, '@gemini-cli /review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR", "CONTRIBUTOR"]'), github.event.review.author_association)
      )
    timeout-minutes: 15
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout PR code (pull_request)'
        if: |-
          ${{ github.event_name == 'pull_request' }}
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 'Checkout PR code (workflow_dispatch)'
        if: |-
          ${{ github.event_name == 'workflow_dispatch' }}
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 'refs/pull/${{ github.event.inputs.pr_number }}/head'

      - name: 'Checkout PR code (issue_comment)'
        if: |-
          ${{ github.event_name == 'issue_comment' }}
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 'refs/pull/${{ github.event.issue.number }}/head'

      - name: 'Checkout PR code (pull_request_review & pull_request_review_comment)'
        if: |-
          ${{ github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' }}
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v4
        with:
          fetch-depth: 0
          ref: 'refs/pull/${{ github.event.pull_request.number }}/head'

      - name: 'Generate GitHub App Token'
        id: 'generate_token'
        if: |-
          ${{ vars.APP_ID }}
        uses: 'actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'

      - name: 'Get PR details (pull_request & workflow_dispatch)'
        id: 'get_pr'
        if: |-
          ${{ github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch' }}
        env:
          GH_TOKEN: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          EVENT_NAME: '${{ github.event_name }}'
          WORKFLOW_PR_NUMBER: '${{ github.event.inputs.pr_number }}'
          PULL_REQUEST_NUMBER: '${{ github.event.pull_request.number }}'
        run: |-
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "workflow_dispatch" ]]; then
            PR_NUMBER="${WORKFLOW_PR_NUMBER}"
          else
            PR_NUMBER="${PULL_REQUEST_NUMBER}"
          fi

          if [[ -z "${PR_NUMBER}" ]]; then
            echo "::error::PR_NUMBER is empty. Cannot proceed."
            exit 1
          fi

          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"
          echo "additional_instructions=" >> "${GITHUB_OUTPUT}"

          PR_DATA="$(gh pr view "${PR_NUMBER}" --json title,additions,deletions,changedFiles,baseRefName,headRefName)"
          {
            echo "pr_data<<EOF"
            echo "${PR_DATA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          CHANGED_FILES="$(gh pr diff "${PR_NUMBER}" --name-only)"
          {
            echo "changed_files<<EOF"
            echo "${CHANGED_FILES}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: 'Get PR details (issue_comment)'
        id: 'get_pr_comment'
        if: |-
          ${{ github.event_name == 'issue_comment' && github.event.issue.pull_request }}
        env:
          GH_TOKEN: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          COMMENT_BODY: '${{ github.event.comment.body }}'
          PR_NUMBER: '${{ github.event.issue.number }}'
        run: |-
          set -euo pipefail

          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

          ADDITIONAL_INSTRUCTIONS="$(
            echo "${COMMENT_BODY}" | sed 's/.*@gemini-cli \/review//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          )"
          echo "additional_instructions=${ADDITIONAL_INSTRUCTIONS}" >> "${GITHUB_OUTPUT}"

          PR_DATA="$(gh pr view "${PR_NUMBER}" --json title,additions,deletions,changedFiles,baseRefName,headRefName)"
          {
            echo "pr_data<<EOF"
            echo "${PR_DATA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          CHANGED_FILES="$(gh pr diff "${PR_NUMBER}" --name-only)"
          {
            echo "changed_files<<EOF"
            echo "${CHANGED_FILES}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: 'Get PR details (pull_request_review & pull_request_review_comment)'
        id: 'get_pr_review'
        if: |-
          ${{ github.event_name == 'pull_request_review' || github.event_name == 'pull_request_review_comment' }}
        env:
          GH_TOKEN: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          EVENT_NAME: '${{ github.event_name }}'
          REVIEW_BODY: '${{ github.event.review.body }}'
          COMMENT_BODY: '${{ github.event.comment.body }}'
          PR_NUMBER: '${{ github.event.pull_request.number }}'
        run: |-
          set -euo pipefail

          echo "pr_number=${PR_NUMBER}" >> "${GITHUB_OUTPUT}"

          if [[ "${EVENT_NAME}" == "pull_request_review" ]]; then
            TRIGGER_BODY="${REVIEW_BODY}"
          else
            TRIGGER_BODY="${COMMENT_BODY}"
          fi

          ADDITIONAL_INSTRUCTIONS="$(
            echo "${TRIGGER_BODY}" | sed 's/.*@gemini-cli \/review//' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//'
          )"
          echo "additional_instructions=${ADDITIONAL_INSTRUCTIONS}" >> "${GITHUB_OUTPUT}"

          PR_DATA="$(gh pr view "${PR_NUMBER}" --json title,additions,deletions,changedFiles,baseRefName,headRefName)"
          {
            echo "pr_data<<EOF"
            echo "${PR_DATA}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

          CHANGED_FILES="$(gh pr diff "${PR_NUMBER}" --name-only)"
          {
            echo "changed_files<<EOF"
            echo "${CHANGED_FILES}"
            echo "EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: 'Run Gemini PR Review — Maintainability'
        uses: 'google-github-actions/run-gemini-cli@f77273f4c914e4bf38440cf36a0369cb64a37489' # ratchet:google-github-actions/run-gemini-cli@v0
        id: 'gemini_pr_review'
        env:
          GH_TOKEN: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          GITHUB_PERSONAL_ACCESS_TOKEN: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          GEMINI_CLI_TRUST_WORKSPACE: 'true'
          PR_NUMBER: '${{ steps.get_pr.outputs.pr_number || steps.get_pr_comment.outputs.pr_number || steps.get_pr_review.outputs.pr_number }}'
          PR_DATA: '${{ steps.get_pr.outputs.pr_data || steps.get_pr_comment.outputs.pr_data || steps.get_pr_review.outputs.pr_data }}'
          CHANGED_FILES: '${{ steps.get_pr.outputs.changed_files || steps.get_pr_comment.outputs.changed_files || steps.get_pr_review.outputs.changed_files }}'
          ADDITIONAL_INSTRUCTIONS: '${{ steps.get_pr.outputs.additional_instructions || steps.get_pr_comment.outputs.additional_instructions || steps.get_pr_review.outputs.additional_instructions }}'
          REPOSITORY: '${{ github.repository }}'
        with:
          gemini_model: 'gemini-3.5-flash'
          gemini_cli_version: '${{ vars.GEMINI_CLI_VERSION }}'
          gcp_workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          gcp_project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          gcp_location: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          gcp_service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'
          gemini_api_key: '${{ secrets.GEMINI_API_KEY }}'
          use_vertex_ai: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          use_gemini_code_assist: '${{ vars.GOOGLE_GENAI_USE_GCA }}'
          settings: |-
            {
              "maxSessionTurns": 20,
              "mcpServers": {
                "github": {
                  "command": "docker",
                  "args": [
                    "run",
                    "-i",
                    "--rm",
                    "-e",
                    "GITHUB_PERSONAL_ACCESS_TOKEN",
                    "ghcr.io/github/github-mcp-server:v1.5.0"
                  ],
                  "includeTools": [
                    "create_pending_pull_request_review",
                    "add_comment_to_pending_review",
                    "submit_pending_pull_request_review"
                  ]
                }
              },
              "coreTools": [
                "run_shell_command(echo)",
                "run_shell_command(gh pr view)",
                "run_shell_command(gh pr diff)",
                "run_shell_command(cat)",
                "run_shell_command(head)",
                "run_shell_command(tail)",
                "run_shell_command(grep)"
              ],
              "telemetry": {
                "enabled": false,
                "target": "gcp"
              }
            }
          prompt: |-
            ## Role

            You are an expert code reviewer specializing in maintainability. Your sole focus is
            identifying objective, concrete issues that make code harder to read, understand, or
            modify over time. You have access to tools to gather PR information and post the
            review on GitHub. Use the available tools to gather information; do not ask for
            information to be provided.

            ## Steps

            Start by running these commands to gather the required data:
            1. Run: echo "${REPOSITORY}" to get the github repository in <OWNER>/<REPO> format
            2. Run: echo "${PR_DATA}" to get PR details (JSON format)
            3. Run: echo "${CHANGED_FILES}" to get the list of changed files
            4. Run: echo "${PR_NUMBER}" to get the PR number
            5. Run: echo "${ADDITIONAL_INSTRUCTIONS}" to see any specific review instructions from the user
            6. Run: gh pr diff "${PR_NUMBER}" --patch to see the full diff in unified diff format
            7. For any specific files, use: cat filename, head -50 filename, or tail -50 filename
            8. If ADDITIONAL_INSTRUCTIONS contains text, prioritize those specific areas in your review

            ## Review Criteria — Maintainability Only

            You MUST ONLY comment on concrete, objective maintainability issues. Do not comment
            on correctness, security, formatting (handled by the linter), or documentation
            coverage. Focus exclusively on:

            * Poor naming — variable, function, or class names that are misleading, cryptic,
              or inconsistent with the surrounding codebase (e.g. single-letter names outside
              loop counters, names that contradict what the code does)
            * Magic numbers — hardcoded numeric or string literals that should be named constants
              (e.g. `if status == 42` instead of `if status == MAX_RETRIES`)
            * Obvious code duplication — identical or near-identical logic copy-pasted in the
              same diff that should be extracted into a shared function or constant

            Do NOT comment on:
            - Formatting or indentation (the linter handles this)
            - Missing or insufficient documentation/docstrings
            - Subjective complexity ("this function is too long")
            - Anything that is a matter of taste rather than an objective problem

            ## Guidelines

            1. Only comment if there is a concrete, objective maintainability problem.
               If a name is unusual but unambiguous, do not flag it.
            2. Provide a clear explanation and a suggested improvement where possible.
            3. Severity: maintainability issues are generally `low` or `medium`.
               Use `medium` for issues that will actively impede future changes,
               `low` for minor issues that could be addressed at the author's discretion.
            4. Only comment on lines prefixed with `+` or `-` in the diff. Never on context lines.
            5. Do not comment on license headers, copyright, or hardcoded dates/times.
            6. Comments in `.md` files should be `low` severity at most.
            7. Do not explain what the code does. Only comment when there is an objective problem.
            8. Keep each comment focused on one issue. Be concise.
            9. Do not approve the PR.

            **Severity emoji:** 🔴 critical · 🟠 high · 🟡 medium · 🟢 low · 🔵 unclear

            **Inline comment format (preferred):**
            <COMMENT>
            🟢 Brief description of the maintainability issue
            ```suggestion
            improved code here
            ```
            </COMMENT>

            ## Context

            The diff fetched in step 6 is in unified diff format. Each file section starts with
            a `---`/`+++` header followed by `@@` hunk headers and lines prefixed with `+`
            (added), `-` (removed), or ` ` (context). Restrict all comments to lines within
            the diff hunks. Comments out of bounds will cause the review to fail.

            ## Post the Review

            1. Create a pending review: mcp__github__create_pending_pull_request_review
            2. Add inline comments: mcp__github__add_comment_to_pending_review (repeat as needed)
            3. Submit the review: mcp__github__submit_pending_pull_request_review

            Summary format:
            ## 📋 Maintainability Review Summary
            Brief 2-3 sentence overview of maintainability findings.

            ## 🔍 Findings
            - List any maintainability issues not addressed inline
            - Note if no maintainability issues were found

            ## Final Instructions

            You are running in a VM. Your review MUST be posted to GitHub using the MCP tools.
            Nothing you output to stdout will be seen — only what you post via MCP counts.

      - name: 'Post PR review failure comment'
        if: |-
          ${{ failure() && (steps.gemini_pr_review.outcome == 'failure' || steps.gemini_pr_review.outcome == 'skipped') }}
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        with:
          github-token: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          script: |-
            github.rest.issues.createComment({
              owner: '${{ github.repository_owner }}',
              repo: '${{ github.event.repository.name }}',
              issue_number: '${{ steps.get_pr.outputs.pr_number || steps.get_pr_comment.outputs.pr_number || steps.get_pr_review.outputs.pr_number }}',
              body: 'There is a problem with the Gemini CLI **Maintainability** PR review. Please check the [action logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
