name: '📋 Antigravity Scheduled Issue Triage'

on:
  schedule:
    - cron: '0 * * * *' # Runs every hour
  workflow_dispatch:

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: false

defaults:
  run:
    shell: 'bash'

permissions:
  contents: 'read'
  id-token: 'write'
  issues: 'write'

jobs:
  agy-triage-issues:
    timeout-minutes: 30
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v4
        with:
          sparse-checkout: '.github/actions'
          sparse-checkout-cone-mode: false

      - name: 'Generate GitHub App Token'
        id: 'generate_token'
        if: vars.APP_ID != ''
        uses: 'actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'

      - name: 'Find untriaged issues'
        id: 'find_issues'
        env:
          GITHUB_TOKEN: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          GITHUB_REPOSITORY: '${{ github.repository }}'
        run: |-
          set -euo pipefail

          echo '🔍 Finding issues without labels...'
          NO_LABEL_ISSUES="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --limit 100 \
            --search 'is:open is:issue no:label' --json number,title,body)"

          echo '🏷️ Finding issues that need triage...'
          NEED_TRIAGE_ISSUES="$(gh issue list --repo "${GITHUB_REPOSITORY}" \
            --limit 100 \
            --search 'is:open is:issue label:"status/needs-triage"' --json number,title,body)"

          echo '🔄 Merging and deduplicating issues...'
          ISSUES="$(echo "${NO_LABEL_ISSUES}" "${NEED_TRIAGE_ISSUES}" | jq -c -s 'add | unique_by(.number)')"

          echo '📝 Setting output for GitHub Actions...'
          echo "${ISSUES}" > /tmp/issues_to_triage.json
          ISSUE_COUNT="$(echo "${ISSUES}" | jq 'length')"
          echo "issue_count=${ISSUE_COUNT}" >> "${GITHUB_OUTPUT}"
          echo "✅ Found ${ISSUE_COUNT} issues to triage! 🎯"

      - name: 'Validate required configuration'
        if: steps.find_issues.outputs.issue_count != '0'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GOOGLE_CLOUD_PROJECT: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
        run: |-
          set -euo pipefail
          if [[ -z "${GEMINI_API_KEY}" && -z "${GOOGLE_CLOUD_PROJECT}" ]]; then
            echo "::error::Neither GEMINI_API_KEY nor GOOGLE_CLOUD_PROJECT is configured. At least one must be set for the Antigravity CLI to authenticate."
            exit 1
          fi

      - name: 'Authenticate to Google Cloud'
        if: steps.find_issues.outputs.issue_count != '0' && vars.GCP_WIF_PROVIDER != '' && vars.SERVICE_ACCOUNT_EMAIL != ''
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # ratchet:google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'

      - name: 'Install Antigravity CLI'
        if: steps.find_issues.outputs.issue_count != '0'
        uses: './.github/actions/install-agy'

      - name: 'Run Antigravity Issue Triage'
        if: steps.find_issues.outputs.issue_count != '0'
        id: 'agy_issue_triage'
        env:
          GITHUB_TOKEN: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GOOGLE_CLOUD_PROJECT: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          GOOGLE_CLOUD_LOCATION: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          GOOGLE_GENAI_USE_VERTEXAI: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          set -euo pipefail
          trap 'rm -f /tmp/agy_scheduled_triage_prompt.txt /tmp/agy_scheduled_triage_prompt_raw.txt /tmp/issues_to_triage.json' EXIT
          ISSUES_TO_TRIAGE="$(cat /tmp/issues_to_triage.json)"
          HEREDOC_DELIMITER="$(openssl rand -hex 16)"
          cat > /tmp/agy_scheduled_triage_prompt_raw.txt <<"${HEREDOC_DELIMITER}"
            ## Role

            You are an issue triage assistant. Analyze issues and apply
            appropriate labels. Use the available tools to gather information;
            do not ask for information to be provided.

            ## Context

            - **Repository**: ${REPOSITORY}
            - **Issues to Triage** (JSON array):
            ${ISSUES_TO_TRIAGE}

            ## Steps

            1. Run: gh label list --repo "${REPOSITORY}" to get all available labels.
            2. Parse the ISSUES_TO_TRIAGE JSON array above. Each element has
               number, title, and body fields.
            3. For each issue, apply labels:
               gh issue edit "<number>" --add-label "label1,label2" --repo "${REPOSITORY}"
               If available, set labels that follow the kind/*, area/*,
               and priority/* patterns.
            4. For each issue, if the status/needs-triage label is present,
               remove it using:
               gh issue edit "<number>" --remove-label "status/needs-triage" --repo "${REPOSITORY}"

            ## Guidelines

            - Only use existing repository labels
            - Do not add comments
            - Triage each issue independently
            - Reference all shell variables as "${VAR}" (with quotes and braces)
          ${HEREDOC_DELIMITER}
          sed 's/^          //' /tmp/agy_scheduled_triage_prompt_raw.txt > /tmp/agy_scheduled_triage_prompt.txt
          rm -f /tmp/agy_scheduled_triage_prompt_raw.txt
          agy --print --dangerously-skip-permissions "$(cat /tmp/agy_scheduled_triage_prompt.txt)"

      - name: 'Cleanup'
        if: always()
        run: rm -f /tmp/issues_to_triage.json /tmp/agy_scheduled_triage_prompt.txt /tmp/agy_scheduled_triage_prompt_raw.txt
