name: 'AI PR Review — AGY Smoke Test (temporary)'

# THROWAWAY VALIDATION WORKFLOW — delete once ADC auth is confirmed working.
#
# Proves that Antigravity CLI (agy) can authenticate headlessly via
# Application Default Credentials (ADC) derived from this repo's existing
# GitHub Actions Workload Identity Federation setup (the same
# GCP_WIF_PROVIDER / SERVICE_ACCOUNT_EMAIL / GOOGLE_CLOUD_PROJECT vars used
# by the current gemini-cli-based ai-pr-review-*.yml workflows), before any
# production workflow is migrated off gemini-cli onto agy.
#
# aiplatform.googleapis.com is enabled and wif-service-account@... has
# roles/aiplatform.user on adk-samples-repo-gcp-support as of 2026-08-12.
# The remaining unknown this test resolves: whether a context-aware-access
# policy on this project (confirmed to block plain `gcloud` calls from an
# unmanaged machine, while Cloud Shell — a Google-managed environment — goes
# through fine) also blocks WIF-based service-account auth from a GitHub
# Actions runner, or only gates interactive human (`user:`) sign-ins.
#
# Run it manually from the Actions tab (workflow_dispatch). It does not
# touch any PR, issue, or repo content — it only proves the auth + headless
# invocation path.

on:
  # TEMPORARY: `workflow_dispatch` only works once a workflow is on the
  # default branch, so this push trigger is how the smoke test runs before
  # anything is merged. Remove it (along with this whole file) once ADC auth
  # is confirmed.
  push:
    branches:
      - 'test/agy-pr-review-migration'
    paths:
      - '.github/workflows/ai-agy-smoke-test.yml'
  workflow_dispatch:
    inputs:
      prompt:
        description: 'Prompt to send to agy for the smoke test'
        required: false
        type: 'string'
        default: 'Reply with exactly the single word: OK'

permissions:
  contents: 'read'
  id-token: 'write'

jobs:
  agy-smoke-test:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 10
    steps:
      # Required by google-github-actions/auth so it has a $GITHUB_WORKSPACE
      # to write the generated credentials file into.
      - name: 'Checkout'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v4
        with:
          fetch-depth: 1

      - name: 'Authenticate to Google Cloud (Workload Identity Federation)'
        id: 'auth'
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # ratchet:google-github-actions/auth@v2.1.13
        with:
          project_id: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'

      - name: 'Install Antigravity CLI (agy)'
        run: |-
          set -euo pipefail
          curl -fsSL https://antigravity.google/cli/install.sh | bash
          echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"

      - name: 'Print agy version'
        run: |-
          set -euo pipefail
          agy --version

      # google-github-actions/auth exports GOOGLE_APPLICATION_CREDENTIALS
      # pointing at a gha-creds-*.json file inside $GITHUB_WORKSPACE — it does
      # NOT write to the gcloud-CLI well-known ADC path. Google's standard ADC
      # resolution checks GOOGLE_APPLICATION_CREDENTIALS first, so agy should
      # pick it up automatically; the copy below is a belt-and-suspenders
      # fallback in case agy only checks the well-known path as its docs
      # example suggests. This step reports which of the two actually exists
      # so we know which mechanism agy relies on.
      - name: 'Mirror credentials to the well-known gcloud ADC path'
        env:
          GOOGLE_CLOUD_PROJECT: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
        run: |-
          set -euo pipefail
          echo "GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS:-<unset>}"

          # agy reads `quota_project_id` straight out of the ADC JSON and
          # passes it to the Code Assist backend. google-github-actions/auth
          # does not write that field, so agy authenticated with an empty
          # quota project and every backend call came back "You are not
          # logged into Antigravity". Inject it.
          jq --arg p "${GOOGLE_CLOUD_PROJECT}" '. + {quota_project_id: $p}' \
            "${GOOGLE_APPLICATION_CREDENTIALS}" > /tmp/adc_with_quota.json

          echo "credential type: $(jq -r '.type // "?"' /tmp/adc_with_quota.json)"
          echo "quota_project_id: $(jq -r '.quota_project_id // "?"' /tmp/adc_with_quota.json)"

          mkdir -p "${HOME}/.config/gcloud"
          cp /tmp/adc_with_quota.json "${HOME}/.config/gcloud/application_default_credentials.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=/tmp/adc_with_quota.json" >> "${GITHUB_ENV}"

      # DIAGNOSTIC: `agy models` fetches the model list from the server, so
      # the ids it returns depend on how the CLI is authenticated. The ids a
      # personal Antigravity sign-in offers are not necessarily the ids a
      # WIF service account sees, and agy validates --model against exactly
      # this list. Print it so the runner tells us its own valid ids.
      - name: 'List models visible under ADC'
        continue-on-error: true
        env:
          AGY_ADC_AUTH: 'true'
          GOOGLE_CLOUD_PROJECT: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          GOOGLE_CLOUD_LOCATION: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
        run: |-
          set +e

          echo "=== identity ADC resolves to ==="
          gcloud auth list 2>&1 | head -10

          echo "=== agy models ==="
          agy models 2>&1; echo "models exit=$?"

          echo "=== default model (no --model flag) ==="
          agy -p 'Reply with exactly the single word: OK' \
            --output-format json --print-timeout 3m 2>&1
          echo "default-model exit=$?"

          # agy's own log records the auth method, the resolved identity and
          # the reason the model catalog fetch failed — none of which reach
          # stdout. This is the line that actually explains the timeout.
          echo "=== agy internal log (auth + model lines) ==="
          grep -hiE "adcAuth|applyAuthResult|authMethod|ChainedAuth|fetchAvailableModels|model_config|Auth mode|token source|codeAssist" \
            "${HOME}"/.gemini/antigravity-cli/log/*.log 2>/dev/null \
            | sed 's/^ERROR: logging before google.Init: //' | tail -40

      - name: 'Run agy in headless mode via ADC'
        id: 'agy_smoke'
        env:
          AGY_ADC_AUTH: 'true'
          GOOGLE_CLOUD_PROJECT: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          GOOGLE_CLOUD_LOCATION: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          # `inputs` is empty on a push event, so fall back to the default.
          PROMPT: '${{ inputs.prompt || ''Reply with exactly the single word: OK'' }}'
        run: |-
          set -euo pipefail

          # Write straight to disk rather than into a `$(...)` capture: agy
          # reports failures on stdout, and under `set -e` a capture is
          # discarded before it can ever be printed. stderr is teed in too,
          # so a non-JSON crash is still visible in the log.
          set +e
          agy -p "${PROMPT}" \
            --model gemini-3.5-flash-medium \
            --output-format json \
            --print-timeout 3m > agy_result.json 2> agy_stderr.log
          AGY_EXIT=$?
          set -e

          echo "=== agy exit code: ${AGY_EXIT} ==="
          echo "=== stdout ==="
          cat agy_result.json || true
          echo "=== stderr ==="
          cat agy_stderr.log || true
          echo "=============="

          if [[ "${AGY_EXIT}" -ne 0 ]]; then
            echo "::error::agy exited ${AGY_EXIT} — see stdout/stderr above"
            exit 1
          fi

          STATUS="$(jq -r '.status' agy_result.json)"
          echo "status=${STATUS}" >> "${GITHUB_OUTPUT}"

          if [[ "${STATUS}" != "SUCCESS" ]]; then
            echo "::error::agy smoke test failed with status=${STATUS}: $(jq -r '.error // "unknown error"' agy_result.json)"
            exit 1
          fi

          echo "::notice::agy responded: $(jq -r '.response' agy_result.json)"

      - name: 'Upload result for inspection'
        if: always()
        uses: 'actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02' # ratchet:actions/upload-artifact@v4
        with:
          name: 'agy-smoke-result'
          path: 'agy_result.json'
          if-no-files-found: 'ignore'
