name: 'Go Stale-Issue Auditor (reusable)'

# Reusable workflow: a caller repository audits ITS OWN issues for staleness
# with the go/github-bots/stale-issues bot, without copying the bot's code.
#
# Because a reusable workflow runs in the caller's context, the built-in
# GITHUB_TOKEN (scoped by the caller's `permissions:` block) writes to the
# caller repo, and OWNER/REPO resolve to the caller. See
# go/github-bots/stale-issues/README.md for the caller snippet.
on:
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number to audit (empty = sweep the backlog).'
        type: 'string'
        required: false
        default: ''
      dry_run:
        description: 'Log intended actions without modifying any issues.'
        type: 'boolean'
        required: false
        default: false
      maintainers:
        description: 'Comma-separated maintainer GitHub logins (required for correct decisions).'
        type: 'string'
        required: true
      stale_hours:
        description: 'Hours waiting on the author before marking stale.'
        type: 'string'
        required: false
        default: '336'
      close_hours_after_stale:
        description: 'Hours stale before closing.'
        type: 'string'
        required: false
        default: '168'
      samples_ref:
        description: >-
          Ref of google/adk-samples to run the bot code from. Defaults to the
          commit this workflow file itself was loaded from, so a caller pinning
          `uses: ...@<sha>` also pins the bot code. Override only to test an
          unmerged branch.
        type: 'string'
        required: false
        default: ''
    secrets:
      GEMINI_API_KEY:
        description: 'Gemini API key. Omit only if the caller configures Vertex AI.'
        required: false

permissions:
  contents: 'read'
  issues: 'write'

jobs:
  stale:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    steps:
      # Check out adk-samples (the bot code). A reusable workflow's default
      # checkout would fetch the CALLER repo, so we target adk-samples explicitly.
      - name: 'Checkout adk-samples'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5.0.0
        with:
          repository: 'google/adk-samples'
          ref: '${{ inputs.samples_ref || job.workflow_sha }}'
          # The bot code is executed by `go run .` in a later step. Leaving the
          # token in .git/config would expose it to everything in that build.
          persist-credentials: false

      - name: 'Set up Go'
        uses: 'actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff' # ratchet:actions/setup-go@v5
        with:
          go-version-file: 'go/github-bots/stale-issues/go.mod'

      - name: 'Run stale-issue auditor'
        working-directory: 'go/github-bots/stale-issues'
        env:
          # Caller-context values (resolve to the repo that called this workflow).
          GITHUB_TOKEN: '${{ github.token }}'
          # github.repository is "owner/name" and is populated on every event,
          # including schedule (where github.event.repository is absent). Split it
          # in the script below rather than reading the event payload, so a
          # scheduled sweep targets the caller repo instead of falling back.
          REPO_SLUG: '${{ github.repository }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          MAINTAINERS: '${{ inputs.maintainers }}'
          DRY_RUN: '${{ inputs.dry_run }}'
          STALE_HOURS_THRESHOLD: '${{ inputs.stale_hours }}'
          CLOSE_HOURS_AFTER_STALE_THRESHOLD: '${{ inputs.close_hours_after_stale }}'
          # Untrusted input passed via env (never interpolated into the script),
          # validated as numeric below.
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
        run: |
          set -euo pipefail
          export OWNER="${REPO_SLUG%%/*}"
          export REPO="${REPO_SLUG#*/}"
          if [[ -n "${ISSUE_NUMBER}" ]]; then
            if [[ "${ISSUE_NUMBER}" =~ ^[0-9]+$ ]]; then
              go run . "-issue=${ISSUE_NUMBER}"
            else
              echo "Ignoring non-numeric issue input: ${ISSUE_NUMBER}" >&2
              exit 1
            fi
          else
            go run .
          fi
