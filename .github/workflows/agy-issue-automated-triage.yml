name: '🏷️ Antigravity Automated Issue Triage'

on:
  issues:
    types:
      - 'opened'
      - 'reopened'
  issue_comment:
    types:
      - 'created'
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'issue number to triage'
        required: true
        type: 'number'

concurrency:
  group: '${{ github.workflow }}-${{ github.event.issue.number || github.event.inputs.issue_number }}'
  cancel-in-progress: true

defaults:
  run:
    shell: 'bash'

permissions:
  contents: 'read'
  id-token: 'write'
  issues: 'write'

jobs:
  agy-triage-issue:
    if: |-
      github.event.sender.type != 'Bot' && (
        github.event_name == 'issues' ||
        github.event_name == 'workflow_dispatch' ||
        (
          github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@agy /triage') &&
          contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
        )
      )
    timeout-minutes: 5
    runs-on: 'ubuntu-latest'

    steps:
      - name: 'Checkout repository'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v4
        with:
          sparse-checkout: '.github/actions'
          sparse-checkout-cone-mode: false

      - name: 'Generate GitHub App Token'
        id: 'generate_token'
        if: vars.APP_ID != ''
        uses: 'actions/create-github-app-token@67018539274d69449ef7c02e8e71183d1719ab42' # ratchet:actions/create-github-app-token@v2
        with:
          app-id: '${{ vars.APP_ID }}'
          private-key: '${{ secrets.APP_PRIVATE_KEY }}'

      - name: 'Validate required configuration'
        env:
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GOOGLE_CLOUD_PROJECT: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
        run: |-
          set -euo pipefail
          if [[ -z "${GEMINI_API_KEY}" && -z "${GOOGLE_CLOUD_PROJECT}" ]]; then
            echo "::error::Neither GEMINI_API_KEY nor GOOGLE_CLOUD_PROJECT is configured. At least one must be set for the Antigravity CLI to authenticate."
            exit 1
          fi

      - name: 'Authenticate to Google Cloud'
        if: vars.GCP_WIF_PROVIDER != '' && vars.SERVICE_ACCOUNT_EMAIL != ''
        uses: 'google-github-actions/auth@c200f3691d83b41bf9bbd8638997a462592937ed' # ratchet:google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ vars.GCP_WIF_PROVIDER }}'
          service_account: '${{ vars.SERVICE_ACCOUNT_EMAIL }}'

      - name: 'Install Antigravity CLI'
        uses: './.github/actions/install-agy'

      - name: 'Get issue details'
        id: 'get_issue'
        env:
          GITHUB_TOKEN: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          ISSUE_NUMBER: '${{ github.event.issue.number || github.event.inputs.issue_number }}'
        run: |-
          set -euo pipefail
          TITLE=$(gh issue view "${ISSUE_NUMBER}" --json title --template '{{.title}}')
          DELIMITER="$(openssl rand -hex 16)"
          {
            echo "title<<${DELIMITER}"
            echo "${TITLE}"
            echo "${DELIMITER}"
          } >> "${GITHUB_OUTPUT}"
          BODY=$(gh issue view "${ISSUE_NUMBER}" --json body --template '{{.body}}')
          DELIMITER="$(openssl rand -hex 16)"
          {
            echo "body<<${DELIMITER}"
            echo "${BODY}"
            echo "${DELIMITER}"
          } >> "${GITHUB_OUTPUT}"

      - name: 'Run Antigravity Issue Triage'
        id: 'agy_issue_triage'
        env:
          GITHUB_TOKEN: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          GOOGLE_CLOUD_PROJECT: '${{ vars.GOOGLE_CLOUD_PROJECT }}'
          GOOGLE_CLOUD_LOCATION: '${{ vars.GOOGLE_CLOUD_LOCATION }}'
          GOOGLE_GENAI_USE_VERTEXAI: '${{ vars.GOOGLE_GENAI_USE_VERTEXAI }}'
          ISSUE_NUMBER: '${{ github.event.issue.number || github.event.inputs.issue_number }}'
          ISSUE_TITLE: '${{ steps.get_issue.outputs.title }}'
          ISSUE_BODY: '${{ steps.get_issue.outputs.body }}'
          REPOSITORY: '${{ github.repository }}'
        run: |-
          set -euo pipefail
          trap 'rm -f /tmp/agy_triage_prompt.txt /tmp/agy_triage_prompt_raw.txt' EXIT
          HEREDOC_DELIMITER="$(openssl rand -hex 16)"
          cat > /tmp/agy_triage_prompt_raw.txt <<"${HEREDOC_DELIMITER}"
            ## Role

            You are an issue triage assistant. Analyze the current GitHub issue
            and apply the most appropriate existing labels. Use the available
            tools to gather information; do not ask for information to be
            provided.

            ## Context

            - **Repository**: ${REPOSITORY}
            - **Issue Number**: ${ISSUE_NUMBER}
            - **Issue Title**: ${ISSUE_TITLE}
            - **Issue Body**:
            ${ISSUE_BODY}

            ## Steps

            1. Run: gh label list --repo "${REPOSITORY}" to get all available labels.
            2. Review the issue title and body provided above.
            3. Classify issues by their kind (bug, enhancement, documentation,
               cleanup, etc) and their priority (p0, p1, p2, p3). Set the
               labels according to the format kind/* and priority/* patterns.
            4. Apply the selected labels to this issue using:
               gh issue edit "${ISSUE_NUMBER}" --add-label "label1,label2" --repo "${REPOSITORY}"
            5. If the "status/needs-triage" label is present, remove it using:
               gh issue edit "${ISSUE_NUMBER}" --remove-label "status/needs-triage" --repo "${REPOSITORY}"

            ## Guidelines

            - Only use labels that already exist in the repository
            - Do not add comments or modify the issue content
            - Triage only the current issue
            - Assign all applicable labels based on the issue content
            - Reference all shell variables as "${VAR}" (with quotes and braces)
          ${HEREDOC_DELIMITER}
          sed 's/^          //' /tmp/agy_triage_prompt_raw.txt > /tmp/agy_triage_prompt.txt
          rm -f /tmp/agy_triage_prompt_raw.txt
          agy --print --dangerously-skip-permissions "$(cat /tmp/agy_triage_prompt.txt)"

      - name: 'Post Issue Triage Failure Comment'
        if: failure() && steps.agy_issue_triage.outcome == 'failure'
        uses: 'actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd'
        with:
          github-token: '${{ steps.generate_token.outputs.token || secrets.GITHUB_TOKEN }}'
          script: |-
            github.rest.issues.createComment({
              owner: '${{ github.repository }}'.split('/')[0],
              repo: '${{ github.repository }}'.split('/')[1],
              issue_number: '${{ github.event.issue.number || github.event.inputs.issue_number }}',
              body: 'There is a problem with the Antigravity CLI issue triaging. Please check the [action logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for details.'
            })
