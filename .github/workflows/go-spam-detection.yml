name: 'Go Spam Detection Bot (reusable)'

# Reusable workflow: a caller repository moderates ITS OWN issues for spam with
# the go/github-bots/spam-detection bot, without copying the bot's code.
#
# Because a reusable workflow runs in the caller's context, the built-in
# GITHUB_TOKEN (scoped by the caller's `permissions:` block) writes to the
# caller repo, and OWNER/REPO resolve to the caller. See
# go/github-bots/spam-detection/README.md for the caller snippet.
on:
  workflow_call:
    inputs:
      issue_number:
        description: 'Issue number to review (empty = sweep recent issues).'
        type: 'string'
        required: false
        default: ''
      dry_run:
        description: 'Log intended actions without labeling or commenting.'
        type: 'boolean'
        required: false
        default: false
      issue_count:
        description: 'Max issues per sweep (most-recently-updated first).'
        type: 'string'
        required: false
        default: '3'
      maintainers:
        description: 'Comma-separated logins whose comments are trusted and never reviewed for spam.'
        type: 'string'
        required: false
        default: ''
      samples_ref:
        description: >-
          Ref of google/adk-samples to run the bot code from. Defaults to the
          commit this workflow file itself was loaded from, so a caller pinning
          `uses: ...@<sha>` also pins the bot code. Override only to test an
          unmerged branch.
        type: 'string'
        required: false
        default: ''
    secrets:
      GEMINI_API_KEY:
        description: 'Gemini API key. Omit only if the caller configures Vertex AI.'
        required: false

permissions:
  contents: 'read'
  issues: 'write'

jobs:
  spam:
    runs-on: 'ubuntu-latest'
    timeout-minutes: 20
    steps:
      # Check out adk-samples (the bot code). A reusable workflow's default
      # checkout would fetch the CALLER repo, so we target adk-samples explicitly.
      - name: 'Checkout adk-samples'
        uses: 'actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8' # ratchet:actions/checkout@v5.0.0
        with:
          repository: 'google/adk-samples'
          ref: '${{ inputs.samples_ref || job.workflow_sha }}'
          # The bot code is executed by `go run .` in a later step. Leaving the
          # token in .git/config would expose it to everything in that build.
          persist-credentials: false

      - name: 'Set up Go'
        uses: 'actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff' # ratchet:actions/setup-go@v5
        with:
          go-version-file: 'go/github-bots/spam-detection/go.mod'

      - name: 'Run spam detection bot'
        working-directory: 'go/github-bots/spam-detection'
        env:
          # Caller-context values (resolve to the repo that called this workflow).
          GITHUB_TOKEN: '${{ github.token }}'
          # github.repository is "owner/name" and is populated on every event; use
          # it (split in the script below) as the single reliable source for both
          # OWNER and REPO rather than the event payload.
          REPO_SLUG: '${{ github.repository }}'
          GEMINI_API_KEY: '${{ secrets.GEMINI_API_KEY }}'
          DRY_RUN: '${{ inputs.dry_run }}'
          ISSUE_COUNT: '${{ inputs.issue_count }}'
          MAINTAINERS: '${{ inputs.maintainers }}'
          # Untrusted input passed via env (never interpolated into the script),
          # validated as numeric below.
          ISSUE_NUMBER: '${{ inputs.issue_number }}'
        run: |
          set -euo pipefail
          export OWNER="${REPO_SLUG%%/*}"
          export REPO="${REPO_SLUG#*/}"
          if [[ -n "${ISSUE_NUMBER}" ]]; then
            if [[ "${ISSUE_NUMBER}" =~ ^[0-9]+$ ]]; then
              go run . "-issue=${ISSUE_NUMBER}"
            else
              echo "Ignoring non-numeric issue input: ${ISSUE_NUMBER}" >&2
              exit 1
            fi
          else
            go run .
          fi
