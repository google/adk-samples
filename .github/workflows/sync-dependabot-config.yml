name: Sync Dependabot Config

# Regenerates .github/dependabot.yml by scanning core/, contrib/, and skills/
# for all 5 ADK language ecosystems, then opens a PR with the result.
#
# Triggers
# --------
#   workflow_dispatch — manual trigger from the Actions tab
#
# Why not auto-trigger on push to main?
# main is protected (requires PR review + code-owner sign-off + CLA).
# The github-actions[bot] cannot push directly, so auto-triggering would
# fail silently on every recipe add/remove.  Instead:
#   1. A contributor adds/removes a recipe and their PR merges to main.
#   2. A maintainer (or CI reminder) runs this workflow manually.
#   3. This workflow opens a small sync PR that a code owner approves.
#
# The PR-time freshness check (.github/workflows/validate-recipe-structure.yml
# or any workflow that calls generate_dependabot.py --check) will fail the
# recipe PR itself if the contributor forgot to regenerate the file, giving
# an earlier signal before this manual step is needed.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    name: Regenerate and open PR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # ratchet:actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # ratchet:actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate dependabot.yml
        run: python .github/scripts/generate_dependabot.py

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet .github/dependabot.yml; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "dependabot.yml is already up to date — nothing to do."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "dependabot.yml has changes:"
            git diff .github/dependabot.yml
          fi

      - name: Create branch, commit, and open PR
        if: steps.diff.outputs.changed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          BRANCH="chore/sync-dependabot-config-$(date +%Y%m%d-%H%M%S)"

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git checkout -b "$BRANCH"
          git add .github/dependabot.yml

          # DCO sign-off required by repo policy (web_commit_signoff_required).
          git commit \
            -m "chore: sync dependabot config" \
            -m "Auto-generated by the Sync Dependabot Config workflow." \
            -m "Signed-off-by: github-actions[bot] <github-actions[bot]@users.noreply.github.com>"

          git push origin "$BRANCH"

          gh pr create \
            --title "chore: sync dependabot config" \
            --body "$(cat <<'EOF'
          ## Summary

          Auto-generated by the **Sync Dependabot Config** workflow.

          `.github/dependabot.yml` was regenerated from the current state of `core/`,
          `contrib/`, and `skills/` using `.github/scripts/generate_dependabot.py`.

          No manual edits -- review the diff to confirm the recipe list looks correct,
          then approve and merge.
          EOF
          )" \
            --base main \
            --head "$BRANCH" \
            --label "dependencies"

      # Belt-and-braces cleanup: on EVERY sync run, close any open Dependabot
      # PR whose target directory no longer appears in dependabot.yml. When a
      # directory is removed from config Dependabot itself never closes the
      # PRs it opened for that directory, so without this step they linger as
      # zombies. Cheap when there is nothing to close.
      - name: Close orphaned Dependabot PRs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python .github/scripts/close_orphan_dependabot_prs.py
