# Repository-wide configuration constants.
#
# Single source of truth for numeric limits, thresholds, and other tunable
# values that CI workflows enforce and docs/skills reference. When you
# change a value here, no other file needs updating — workflows load this
# file directly via .github/scripts/load_policy.py, and docs link to it
# rather than inlining the numbers.
#
# Reader helper: .github/scripts/load_policy.py takes a dotted key path
# (e.g. `recipe_size_limits.core.default.max_files`) and prints the value.
# Lists are printed one item per line so callers can `mapfile -t` them.
#
# Add new sections here rather than hardcoding constants in workflow files.

# --------------------------------------------------------------------------
# Recipe size limits — enforced by
# .github/workflows/validate-recipe-structure.yml (language-agnostic).
#
# Recipes live under core/<language>/<recipe> or contrib/<language>/<recipe>
# (e.g. core/python/rag-agent-search, contrib/java/hello-agent).
#
# skills/ uses a VERTICAL rather than a language for its middle component:
# skills/<vertical>/<solution> (e.g. skills/retail/store-ops). The vertical
# surfaces ownership, so a team can see its whole surface at a glance, and
# it is mandatory — tools/validate_placement.py rejects a solution placed
# directly under skills/.
#
# The applicable tier is chosen by:
#   1. Top-level ancestor: core → `core` limits;  contrib → `contrib`
#      limits;  skills → `skills` limits.
#   2. `large:` field in the recipe's manifest.yaml (default: false):
#        false / omitted → `default` limits;  true → `large` limits.
#
# The `excluded_paths` section below lists files and directories that
# NEVER count toward either limit, in any tier.
# --------------------------------------------------------------------------
recipe_size_limits:
  core:
    default:
      max_files: 500
      max_size_mb: 50
    large:
      # `large: true` in core is effectively an escape hatch — this cap is
      # a defensive upper bound, not a real constraint. Bump if a legitimate
      # recipe hits it.
      max_files: 10000
      max_size_mb: 10240  # 10 GB
  contrib:
    default:
      max_files: 70
      max_size_mb: 2
    large:
      max_files: 200
      max_size_mb: 10
  # skills/ deliberately mirrors contrib: a vertical skill is a focused
  # solution (SKILL.md + scripts + design spec + eval), not a full
  # application, so the tighter tier is the right default.
  skills:
    default:
      max_files: 70
      max_size_mb: 2
    large:
      max_files: 200
      max_size_mb: 10

# --------------------------------------------------------------------------
# Recipe naming — enforced by
# .github/workflows/validate-recipe-structure.yml (language-agnostic).
#
# In addition to the length limit, folder names must match ^[a-z][a-z-]*$
# (lowercase letters and hyphens only; must start with a letter). The regex
# is shape-based and lives in tools/validate_structure.py rather than in
# this policy file.
# --------------------------------------------------------------------------
recipe_naming:
  max_folder_name_length: 30

# --------------------------------------------------------------------------
# Retired recipe roots — enforced by the "Check for work in retired folders"
# job in .github/workflows/validate-recipe-structure.yml via
# tools/check_frozen_paths.py.
#
# Recipes used to live at <language>/agents/<recipe> in the repo root. Those
# roots are closed: both new recipes and changes to existing ones belong in
# contrib/<language>/<recipe>. A pull request that ADDS or MODIFIES any file
# under a path listed here fails. Deletions and renames are exempt, so
# migrating a recipe out of a retired folder is never blocked.
#
# Scoped to <language>/agents rather than <language> so that the deprecation
# notice in each <language>/README.md stays editable.
#
# Escape hatches: the job skips for bot authors, and for any PR carrying the
# `allow-legacy-path` label (only users with write access can apply labels).
# --------------------------------------------------------------------------
frozen_paths:
  - python/agents
  - java/agents
  - go/agents
  - kotlin/agents
  - typescript/agents

# --------------------------------------------------------------------------
# Excluded paths — files/directories that never count toward size or file
# count when validating a recipe.
#
# Applied as the UNION of every language section below, regardless of the
# recipe's declared language. Organised per-language for discoverability:
# when adding recipes in a new language, add a section here rather than
# threading language detection through the workflow.
#
# Structure: each language section has two sub-lists:
#   dirs:   directory basenames — pruned wherever they appear in the recipe
#           tree. Both plain names (`node_modules`) and shell globs
#           (`*.egg-info`) are supported.
#   files:  file basenames — excluded wherever they appear. Both plain
#           names (`uv.lock`) and shell globs (`*.tsbuildinfo`) work.
#
# Note: a `dirs:` entry prunes ANY directory with that basename in the
# recipe tree, so a legitimate `bin/`, `build/`, `dist/`, `coverage/`, etc.
# would be excluded too. If you commit such a folder as part of a recipe
# (not as tool output), rename it to avoid the exclusion.
# --------------------------------------------------------------------------
excluded_paths:
  common:
    files:
      - .DS_Store       # macOS filesystem metadata
    dirs:
      - .idea           # IntelliJ project files (almost always accidental)

  python:
    files:
      - uv.lock         # uv lockfile (auto-generated)
    dirs:
      - __pycache__     # bytecode cache
      - .venv           # virtualenv
      - .pytest_cache
      - .mypy_cache
      - .ruff_cache
      - .tox
      - "*.egg-info"    # setuptools/pip package metadata
      - build           # setuptools build output
      - dist            # setuptools/wheel output

  java:
    files: []
    dirs:
      - target          # Maven build output
      - build           # Gradle build output (shared with kotlin)
      - .gradle         # Gradle cache
      - out             # IntelliJ default output
      - bin             # Eclipse default output

  kotlin:
    files: []
    dirs:
      - build           # Gradle build output
      - .gradle
      - .kotlin         # Kotlin compiler cache
      - out
      - bin

  go:
    files:
      - go.sum          # Go module checksum file (auto-generated)
      - "*.test"        # test binaries
    dirs:
      - bin
      - vendor          # vendored deps (sometimes committed intentionally
                        # — treat as tool output for size-limit purposes)

  typescript:
    files:
      - package-lock.json
      - yarn.lock
      - pnpm-lock.yaml
      - bun.lockb       # bun lockfile (binary)
      - "*.tsbuildinfo" # TypeScript incremental build info
    dirs:
      - node_modules
      - dist
      - build
      - .next           # Next.js build output
      - .nuxt           # Nuxt build output
      - .turbo          # Turborepo cache
      - .parcel-cache
      - .cache
      - coverage        # test coverage output

# --------------------------------------------------------------------------
# Required files — enforced by
# .github/workflows/validate-recipe-structure.yml via
# tools/validate_structure.py.
#
# The required-file list applied to a recipe is the UNION of three sources,
# resolved from the recipe's on-disk location and its manifest.language:
#   1. `always`               — every recipe, regardless of anything
#   2. `by_root[<root>]`      — where <root> is core / contrib / skills
#                               (the top-level directory the recipe lives in)
#   3. `by_language[<lang>]`  — where <lang> is the value of manifest.language
#
# Adding a new language, or a new folder-based rule (e.g. skills/*), is a
# YAML edit here — no code change is required. Paths are recipe-relative
# and may include subdirectories (e.g. tests/test_runnability.py).
#
# NOTE: manifest.yaml is intentionally NOT listed here. Its presence is a
# hard prerequisite for every other check (schema validation, language
# detection, `by_language[…]` lookup) and is reported by a dedicated
# fail-fast step in validate_structure.py — adding it to `always` would
# only produce a duplicate error for the same file.
# --------------------------------------------------------------------------
required_files:
  always:
    - README.md

  by_root:
    # AGENTS.md is required for EVERY recipe under core/, regardless of
    # language. This is a broadening of the previous rule (which enforced
    # AGENTS.md only for core/python/*) and is intentional: any core/
    # recipe should carry maintainer-facing context in a canonical file,
    # whether it happens to be Python, Java, Go, TypeScript, or Kotlin.
    # A future `core/java/foo/` without AGENTS.md will fail structural
    # validation — the fix is to add the file, not to loosen the policy.
    core:
      - AGENTS.md
    contrib: []
    # Vertical skills live at skills/<vertical>/<solution>.
    #   SKILL.md  — the conversational installer: runs the interview,
    #               writes the design spec, performs setup.
    #   EVAL.yaml — self-verifying proof of performance (eval rubrics).
    # The one directory a vertical skill must also ship (scripts/) is
    # listed under `required_dirs` below — this section can only express
    # files.
    #
    # A Python vertical skill additionally picks up
    # required_files.by_language.python (pyproject.toml, uv.lock,
    # .env.example, tests/test_runnability.py) via manifest.language. The
    # path does not encode the language for this root — the middle folder
    # is a vertical — so the manifest is what resolves it.
    skills:
      - SKILL.md
      - EVAL.yaml

  by_language:
    python:
      - pyproject.toml
      - uv.lock
      - .env.example
      - tests/test_runnability.py
    go:
      # Every Go recipe is its own module. go.mod is required for three
      # reasons, in increasing order of subtlety:
      #   1. Without it the recipe cannot be built, tested, or versioned.
      #   2. Dependabot's `gomod` ecosystem keys off go.mod, and the orphan
      #      cleanup in .github/scripts/recipe_manifests.py detects Go
      #      recipes the same way (`_is_gomod`), so a recipe without one is
      #      invisible to both. Note this is about DETECTION, not updates:
      #      .github/dependabot.yml carries a `gomod` entry whose only job
      #      is to suppress updates, so no Go recipe receives dependency
      #      PRs and none is meant to. Freshness is the recipe owner's call
      #      — see that file's header.
      #   3. .github/workflows/go-format.yml groups changed files by their
      #      owning go.mod and SKIPS any file it cannot attribute to a
      #      module — because gci's `localmodule` import section reads
      #      ./go.mod and golangci-lint aborts outright when it is missing.
      #      A recipe with no go.mod would therefore be silently unformatted
      #      and unlinted. This entry is what turns that into a loud,
      #      actionable structural failure instead.
      #
      # go.sum is deliberately NOT required: a recipe with no third-party
      # dependencies legitimately has none.
      - go.mod
    # Placeholders for languages that don't have recipes yet. Filling these
    # in later requires no workflow change.
    java: []
    kotlin: []
    typescript: []

# --------------------------------------------------------------------------
# Required directories — enforced by
# .github/workflows/validate-recipe-structure.yml via
# tools/validate_structure.py (check 6).
#
# Resolved exactly like required_files above: the UNION of `always`,
# `by_root[<root>]`, and `by_language[<manifest.language>]`. It is a
# separate section because directories need a different existence test —
# a `scripts` entry under required_files could never be satisfied, since
# that check requires a file.
#
# An empty directory PASSES, which is why this section is kept as small as
# possible. A rule that is satisfied by an empty folder enforces nothing:
# git cannot commit an empty directory, so the author adds a .gitkeep whose
# only purpose is to satisfy a check that already said it does not care
# what is inside. That is pure ceremony, and it reliably confuses people —
# the folder is right there in their editor while CI insists it is missing.
#
# So the bar for listing a directory here is: the recipe is BROKEN without
# it, not merely unconventional. assets/, references/ and tests/unit/ were
# removed under that bar — plenty of vertical skills legitimately ship no
# demo data and no deep-dive docs, and tests/unit/ implied a testing
# discipline it could not enforce (an empty folder passed) while
# tests/test_runnability.py already covers the real requirement as a FILE.
#
# They remain the convention, and the skills scaffold template still
# creates them — prompting an author to fill a folder is the scaffold's
# job, not CI's. See docs/recipe-handbook/anatomy.md.
# --------------------------------------------------------------------------
required_dirs:
  always: []

  by_root:
    core: []
    contrib: []
    # scripts/ — functional code: ADK agents, model implementations,
    #            one-shot GCP setup scripts. A vertical skill with no
    #            scripts/ has nothing to run, so this one is load-bearing.
    skills:
      - scripts

  by_language:
    python: []
    java: []
    go: []
    kotlin: []
    typescript: []

# --------------------------------------------------------------------------
# Staleness policy — enforced by .github/workflows/stale-sweep.yml (pull
# requests and issues) and .github/workflows/stale-branch-sweep.yml
# (branches). Both run weekly on Mondays.
#
# HOW THE CLOSE CLOCK WORKS, and why `close_after_days` is not passed
# straight to actions/stale
# -------------------------------------------------------------------
# actions/stale measures both stages from the item's `updated_at`. Posting
# the nudge and applying the `stale` label IS an update, so it resets
# `updated_at` — which means the second stage is effectively measured from
# the moment the label landed, not from the original last activity.
#
# So the values below are absolute "days since last real activity", and
# stale-sweep.yml feeds the action the DIFFERENCE:
#
#     days-before-*-close  =  close_after_days - nudge_after_days
#
# Passing close_after_days directly is the single easiest mistake to make
# here, and it fails silently: PRs would close on day 150 rather than 90.
# The workflow asserts the difference is positive.
#
# Because the sweeps are weekly, every threshold is a floor with up to six
# days of slack (60 becomes "60-67"). With a 30-day gap between the two
# stages and a 7-day tick, nothing can skip a stage.
# --------------------------------------------------------------------------
stale_policy:
  # Applied to both pull requests and issues. Only users with write access
  # can apply labels, so `keep_open_label` is a maintainer override rather
  # than an escape hatch a contributor can award themselves.
  stale_label: stale
  keep_open_label: keep-open

  pull_requests:
    nudge_after_days: 60
    close_after_days: 90

    # Dependabot PRs get the SAME deadlines, applied by a separate step in
    # stale-sweep.yml over a disjoint set of PRs. Only the wording differs:
    # asking a bot for a status update accomplishes nothing, so that nudge
    # @-mentions a human who can act instead.
    #
    # Note that dependency PRs rarely reach these thresholds — Dependabot
    # rebases its own PRs, which counts as activity. The ones that do go
    # quiet are the ones Dependabot itself has abandoned, which is exactly
    # the set worth escalating.
    bot_label: dependencies
    bot_escalation_mention: happyhuman

  issues:
    # Deliberately triple the PR window, because the two cases are not
    # symmetric. A stale PR is abandoned WORK: closing it is cheap, the
    # commits survive on the contributor's fork, and reopening is one click.
    # A stale issue is unresolved INFORMATION: closing it does not fix the
    # bug, it just means the next person files a duplicate that has lost the
    # original report's reproduction steps.
    #
    # Issue staleness is also evidence about MAINTAINER responsiveness, not
    # about whether the issue is still valid, so a short window would charge
    # reporters for our backlog.
    nudge_after_days: 180
    close_after_days: 210

    exempt_labels:
      - keep-open
      # MANDATORY — do not remove without reading canary_issues.py first.
      #
      # The recipe canary stores its four-rung escalation ladder in the
      # issue's LABELS, and finds its own issues by the title of an OPEN
      # issue. Closing one therefore does not pause the ladder, it ERASES
      # it: the next monthly canary run cannot see the closed issue, files
      # a fresh one with zero rungs, and starts over. The ladder could never
      # reach its final rung, and the two workflows would fight monthly
      # forever.
      #
      # A canary issue is quiet for weeks between rungs BY DESIGN
      # (MIN_DAYS_BETWEEN_STAGES = 21), so it looks exactly like a dead
      # issue to an age-based sweep. It is not.
      - recipe-canary
      # An unfixed vulnerability report must never time out silently.
      - security

    # Both are stronger signals of ownership than any age threshold: an
    # assignee means a person took it, a milestone means it is planned work.
    #
    # Read by stale-sweep.yml and lower-cased on the way through:
    # actions/stale compares its raw input against the string `true`, so the
    # Python-shaped `True` this file's reader prints would read as FALSE.
    exempt_assigned: true
    exempt_milestoned: true

  branches:
    # Three independent clocks. A branch matches exactly ONE, resolved in the
    # order documented in sweep_stale_branches.py::classify. That ordering is
    # load-bearing rather than defensive: this repo is squash-merge only
    # (`allow_squash_merge` is the sole enabled merge method), so a merged
    # branch never becomes an ancestor of the default branch. Ancestry-based
    # merge detection misses every one of them and would misfile provably
    # merged work as an unmerged orphan.
    # MERGED — the branch's work is already on the default branch, either
    # because its pull request was merged or because it is an ancestor.
    # Measured from the MERGE, not the last commit: a long-running branch can
    # carry commits from months ago and still have merged this morning.
    #
    # The branch is now pure leftover, so this could arguably be 0. It is 7
    # so that a bad merge can still be reverted and re-pushed from the
    # original branch during the week that anyone is likely to notice, and so
    # that anything still referencing the branch by name (a running job, a
    # local checkout someone is about to push to) is not yanked out from
    # under it the moment the merge button is pressed.
    #
    # Mostly dead code going forward: the repository has "Automatically
    # delete head branches" enabled, so merged branches usually disappear
    # without this. It still matters for branches merged BEFORE that setting
    # was turned on (six of them at the time of writing), and for merges
    # performed through the API, which can bypass it.
    merged_after_days: 7

    # CLOSED WITHOUT MERGING — someone opened a pull request and it was
    # rejected, superseded, or abandoned.
    #
    # Measured from the CLOSE DATE, not the last commit, and that distinction
    # is the whole point of having this clock separate from `orphan`. The
    # real case it was built for: `fix/rag-agent-model-and-config`, whose
    # last commit is 156 days old but whose PR #1217 was closed 20 days ago.
    # Judged on commit age it is long dead; judged on the close it is a
    # decision somebody made three weeks ago and might still reverse.
    #
    # 30 days because reopening a closed pull request is common and cheap —
    # a contributor asked to rework something typically comes back inside a
    # month, and the branch is what they come back to.
    #
    # This window also covers pull requests the sweep above closes by itself,
    # and that is why stale-sweep.yml leaves actions/stale's `delete-branch`
    # off. Deleting the head branch on close would confine this clock to
    # MANUALLY closed pull requests and skip every auto-closed one — the
    # population likeliest to be revived — and would falsify that workflow's
    # "reopen it, your commits are unaffected" message, since GitHub disables
    # Reopen once the head ref is gone.
    closed_pr_after_days: 30

    # UNMERGED, NEVER HAD A PULL REQUEST — pushed and then forgotten.
    #
    # The only clock that can destroy work existing nowhere else, hence by
    # far the longest. The other two both describe branches whose content is
    # either already on main or was deliberately rejected; this one describes
    # work nobody ever finished submitting.
    orphan_after_days: 90

    # Unlike the PR and issue sweeps, this one keeps a circuit breaker: a
    # branch delete cannot be undone from the UI. A batch this large means a
    # classification bug, not a tidy repository. Mirrors DEFAULT_MAX_CLOSE in
    # close_orphan_dependabot_prs.py, which exists for the same reason.
    max_delete_per_run: 20

    # Never deleted, at any age, whatever the clocks above say. Shell globs
    # are supported (fnmatch, so `release/*` matches `release/1.2` but not
    # `release`).
    #
    # This list is for branches that are not development branches at all —
    # ones that exist to BE somewhere rather than to be merged. Such a branch
    # is indistinguishable from an abandoned one by every signal the sweep
    # has: no pull request, no merge, no recent commits. The list is the only
    # thing standing between it and the orphan clock.
    #
    # Two categories are already handled and do NOT need listing here: the
    # repository's default branch, and any branch carrying a GitHub
    # branch-protection rule. Both are skipped automatically.
    protected:
      # Redundant with the automatic default-branch skip, and deliberately
      # kept. It costs nothing, and it means a repository that renames its
      # default branch, or a copy of this policy used elsewhere, is not
      # relying on that one code path being correct.
      - main

      # LIVE CONTENT BRANCH — not a development branch, and the one entry
      # here whose removal would break something today.
      #
      # It holds exactly two files (a README and a demo GIF) and is written
      # by direct push; it has never had a pull request and is never merged
      # anywhere. So it looks precisely like an abandoned branch: to the
      # orphan clock it is dead 90 days after its last image upload.
      #
      # What breaks: core/python/long-horizon-harness/README.md embeds
      # https://raw.githubusercontent.com/google/adk-samples/assets/long-horizon-harness/horizon-demo.gif
      # where `assets` is the GIT REF. Delete the branch and that image 404s
      # in the recipe's README. Nothing in CI would catch it — docs-links.yml
      # checks links, and this failure is silent until someone looks.
      - assets

      # Pre-emptive: neither exists in this repository today.
      #
      # gh-pages is where GitHub Pages serves from, written by a deploy job
      # rather than by merges — the same shape of trap as `assets`, and a
      # very easy one to add without remembering this file. `release/*`
      # covers long-lived maintenance branches, which by nature stop
      # receiving commits and would age out.
      #
      # Listing them now costs nothing and removes a footgun from whoever
      # creates one later.
      - gh-pages
      - "release/*"

# --------------------------------------------------------------------------
# Case-insensitive required entries.
#
# Names in required_files / required_dirs are matched EXACTLY by default,
# compared in Python rather than by asking the filesystem — otherwise a
# contributor on macOS (case-insensitive by default) could name a file
# `PyProject.toml`, watch it pass locally, and fail on Linux CI.
#
# Listing an entry here relaxes that for it alone: any spelling is
# accepted, and the checker prints an advisory naming the canonical form.
#
# Add to this list SPARINGLY. Only files that nothing else parses belong
# here. Never add pyproject.toml or uv.lock (uv resolves them by exact
# name), tests/test_runnability.py (pytest collects it), or manifest.yaml
# (globbed by the recipe tooling) — accepting a variant spelling would
# pass this check and then break the tool that actually reads the file,
# which is a worse failure than the one the leniency prevents.
# --------------------------------------------------------------------------
case_insensitive_files:
  - EVAL.yaml
