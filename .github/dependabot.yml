# Dependabot configuration.
#
# Recipe dependency VERSION updates are deliberately not configured here.
# That is a policy decision, not an oversight — read on before adding an
# entry back.
#
# Why recipes do not get version updates
# --------------------------------------
# A recipe is a clone-and-study artifact, and its committed uv.lock is a
# verified snapshot: "this exact set of versions was tested and worked."
# A version-update PR replaces that verified set with an unverified one and
# asks a reviewer to bless it. The invariant this repo actually cares about
# is "the recipe still installs from its lock and still passes its tests",
# NOT "the recipe uses current versions".
#
# It also did not work in practice. With one entry per recipe ecosystem the
# repo accumulated 98 open Dependabot PRs, none of which could merge: `main`
# requires a code-owner review, and an approval from GITHUB_TOKEN does not
# satisfy that (see dependabot-auto-merge.yml, which approves as
# github-actions[bot] and therefore never unblocks anything). The review load
# landed on two people by way of the CODEOWNERS catch-all, regardless of who
# actually owned the recipe. That does not scale past the recipe count the
# repo already has, let alone the one it is heading for.
#
# What replaces it
# ----------------
#   - Freshness is the recipe owner's call. Every manifest.yaml declares
#     `ownership.poc`, and an owner who has a reason to move versions is free
#     to do so.
#   - Rot is detected rather than prevented, by a monthly canary that lands
#     separately in #2502 as .github/workflows/recipe-canary.yml. It verifies
#     that each recipe still installs from its committed lockfile
#     (`uv sync --frozen`) and still passes its tests, and files an issue
#     against the recipe's poc when it does not. That catches the failure
#     modes a frozen lock really has — a yanked release, a package pulled
#     from the index, wheels with no build for a newer interpreter — without
#     asking anyone to review a bump that changes nothing they need.
#
# Security updates are NOT affected by this file
# ----------------------------------------------
# Dependabot security updates are a repository setting, and GitHub documents
# that there is no interaction between dependabot.yml and Dependabot security
# alerts. Dropping the recipe ecosystems from this file does not disable
# security PRs; they keep arriving for any advisory with an available patch.
# Deleting this file entirely would not stop them either.
#
# Why github-actions stays
# ------------------------
# It is not a recipe ecosystem. Action pins are this repository's own CI
# supply chain — owned by the repo maintainers rather than by any recipe
# owner, so "the recipe owner decides" does not apply. It is also capped at a
# single grouped PR per week, so it carries none of the volume problem above.
#
# If you add a recipe ecosystem back
# ----------------------------------
# .github/scripts/tests/test_dependabot_config.py pins the absence on purpose
# and will fail, so that re-enabling version updates is a deliberate act with
# a reviewer attached rather than a quiet one-line edit. Update that test in
# the same change, and say why in the PR.
#
# Note that .github/scripts/recipe_manifests.py still detects every ecosystem
# in the tree, and the orphan cleanup in dependabot-housekeeping.yml still
# derives liveness from the tree rather than from this file — so nothing here
# affects which open PRs are treated as orphans.

version: 2
updates:
  # Not a recipe ecosystem: Dependabot reads /.github/workflows and any
  # action.yml at the repo root. `directory: "/"` is what GitHub documents for
  # github-actions; it is not a glob.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "02:00"
    commit-message:
      prefix: chore
      include: scope
    labels:
      - dependencies
      - github-actions
    open-pull-requests-limit: 1
    # `semver-major-days` is invalid for github-actions — its releases (v1,
    # v2, ...) are not semver, and Dependabot rejects the whole config if it
    # appears here.
    cooldown:
      default-days: 7
    groups:
      all-actions:
        patterns:
          - "*"
