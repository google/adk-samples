[project]
name = "adk-samples-tools"
version = "0.1.0"
requires-python = ">=3.11"
authors = [
  { name = "Shahin Saadati", email = "shahins@google.com" },
]
dependencies = [
  "pyyaml",
  "jsonschema",
]

[project.scripts]
validate = "validate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
