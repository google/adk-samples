[project]
name = "crypto-payroll-agent"
version = "0.1.0"
description = "Batch-pays many recipients in ETH or ERC-20 tokens on Base in a single transaction using the Spraay tools from google-adk-community, splitting a pool proportionally by weight and gating every on-chain batch behind a human-in-the-loop USD ceiling."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "plagtech", email = "hello@spraay.app" },
]
license = { text = "Apache-2.0" }
dependencies = [
    "google-adk>=1.0.0",
    # Spraay tools merged in adk-python-community#95 (May 2025) but not yet
    # in a PyPI release. Pinned to an exact commit rather than `main` so the
    # build is reproducible — tracking a moving branch means two installs a
    # day apart can ship different tool code. The pinned commit is what
    # uv.lock resolves and the tests run against; swap it for a version
    # specifier once a PyPI release carries the Spraay tools.
    "google-adk-community @ git+https://github.com/google/adk-python-community.git@396da17a9597d8d5f96e7e1aa8c1c396c738d146",
    "google-cloud-aiplatform[adk,agent_engines]>=1.95.0",
    "web3>=6.0",
    "python-dotenv>=1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["crypto_payroll_agent"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true
