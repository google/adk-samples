type: "standalone"    # Options: [standalone | module]
status: "active"      # Options: [active | inactive]
language: "python"    # Options: [python | java | go | kotlin | typescript]
description: "A unified ADK agent for invoice processing that combines an end-to-end inference pipeline (classification, extraction, 4-phase validation, transformation) with an interactive learning system (ALF correction engine) for continuous improvement -- all in a single self-contained agent."

large: true           # 85 files; exceeds 70-file cap due to exemplary data (PDF invoices + ground truth) and per-case agent output artifacts

architecture:
  agent: "single"      # Options: [single | multi]
  stateful: false      # Options: [true | false]
  datasources:         # Options: [hardcoded | local | external]
    - "local"
    - "external"

dependencies:
  libraries:
    - "ADK"
    - "pdfplumber"
    - "pydantic"
    - "vertexai"
    - "pyyaml"
  services:
    - "GCP Project"
    - "Vertex AI"

ownership:
  team: "octo"
  poc: "pgomran"
  contributors:
    - "dixittanya"

tags:
  - "invoice-processing"
  - "document-processing"
  - "finance"
  - "alf-engine"
  - "adaptive-learning"
  - "gemini"

license: "Apache-2.0"
