[project]
name = "brand-search-optimization"
version = "0.1.0"
description = "Optimizes retail product titles for brand search performance using a multi-agent workflow"
authors = [{ name = "Nikhil Kulkarni", email = "nikhilkul@google.com" }]
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.11"

dependencies = [
    "selenium>=4.30.0,<5.0.0",
    "webdriver-manager>=4.0.2,<5.0.0",
    "pillow>=12.2.0,<13.0.0",
    "google-adk>=1.31.0,<2.0.0",
    "google-cloud-bigquery>=3.25.0",
    "python-dotenv>=1.0.0",
]

[dependency-groups]
dev = [
    "google-adk[eval]>=1.31.0",
    "pytest-asyncio>=0.26.0",
    "pytest>=8.3.5",
    "agent-starter-pack>=0.32.0",
    "ruff>=0.12.2",
    "mypy>=1.17.0",
]

deployment = [
    "absl-py>=2.2.2,<3.0.0",
]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
files = ["brand_search_optimization", "tests", "eval"]
exclude = ["^deployment/", "^\\.venv/", "__pycache__"]


[tool.pytest.ini_options]
pythonpath = "."

[tool.hatch.build.targets.wheel]
packages = ["brand_search_optimization"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.agent-starter-pack]
example_question = "Can you help optimize my brand product title for search?"

[tool.agent-starter-pack.settings]
agent_directory = "brand_search_optimization"

[[tool.uv.index]]
url = "https://pypi.org/simple/"
default = true
